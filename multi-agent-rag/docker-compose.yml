services:
  # FastAPI 백엔드 - 벡터DB/대화기록DB에 직접 접근하는 쪽
  api:
    build: .
    image: multi-agent-rag
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./vectordb:/app/vectordb
      - ./checkpoints.sqlite:/app/checkpoints.sqlite
      - ./users.sqlite:/app/users.sqlite
    command: sh -c "python build_vectordb.py && uvicorn app:app --host 0.0.0.0 --port 8000"

  # Streamlit 채팅 UI - api 컨테이너를 HTTP로만 호출, 자기 데이터는 없음
  ui:
    image: multi-agent-rag  # api가 먼저 빌드해둔 이미지를 그대로 재사용 (이미지 2개 안 만듦)
    ports:
      - "8501:8501"
    environment:
      # 컴포즈 안에서는 컨테이너끼리 서비스 이름(api)을 호스트명처럼 씀 - localhost 아님
      - API_URL=http://api:8000
    depends_on:
      - api
    command: streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0
