name: CI

on:
  push:
    branches: [main]
    paths:
      - "multi-agent-rag/**"
  pull_request:
    branches: [main]
    paths:
      - "multi-agent-rag/**"

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.9 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: multi-agent-rag/requirements.txt

      - name: 의존성 설치
        working-directory: multi-agent-rag
        run: pip install -r requirements.txt

      - name: 문법/임포트 오류 체크
        working-directory: multi-agent-rag
        run: python -m py_compile *.py
